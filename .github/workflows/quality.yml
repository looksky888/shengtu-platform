name: Quality checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Frontend and Go
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install frontend dependencies
        run: npm ci --prefix web

      - name: Audit production frontend dependencies
        run: npm audit --prefix web --omit=dev --audit-level=high

      - name: Test frontend
        run: npm test --prefix web

      - name: Lint frontend
        run: npm run lint --prefix web

      - name: Build and verify embedded frontend
        run: |
          npm run build --prefix web
          npm run verify:dist --prefix web

      - name: Test Go packages
        run: go test -p=1 ./... -count=1

      - name: Test iCloud sidecar Go packages
        working-directory: deploy/icloud-privacy-mail/source
        run: go test -p=1 ./... -count=1

      - name: Vet Go packages
        run: go vet -p=1 ./...

      - name: Audit Go dependencies
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/grok-runtime/requirements.txt
            services/grok-runtime/requirements-test.txt

      - name: Install Grok runtime test dependencies
        run: python -m pip install -r services/grok-runtime/requirements-test.txt

      - name: Test Grok runtime
        working-directory: services/grok-runtime
        run: python -m pytest -q

      - name: Audit Grok runtime dependencies
        run: python -m pip_audit -r services/grok-runtime/requirements.txt

      - name: Build release binary
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION.txt)"
          go build -p=1 -trimpath -tags=embed \
            -ldflags="-s -w -X chatgpt2api/internal/version.Version=${version}" \
            -o "${RUNNER_TEMP}/chatgpt2api" ./cmd/chatgpt2api

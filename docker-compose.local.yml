services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${CHATGPT2API_VERSION:-4.5-20261017-security-remediation}
    image: chatgpt2api:local
    container_name: chatgpt2api-local
    ports:
      - "${CHATGPT2API_BIND_ADDR:-127.0.0.1}:${CHATGPT2API_PORT:-8000}:80"
    env_file:
      - .env
    volumes:
      # Override with local absolute path if needed, e.g. COMPOSE_DATA_DIR=D:/path/to/data
      - ${COMPOSE_DATA_DIR:-./data}:/app/data
      - ./.env:/app/.env
    environment:
      STORAGE_BACKEND: sqlite
      DATABASE_URL: sqlite:////app/data/chatgpt2api.db
    # 存储后端配置 (可选值: json, sqlite, postgres, git)
    # environment:
    #   STORAGE_BACKEND: json

    # 数据库配置 (当 STORAGE_BACKEND=sqlite/postgres 时使用)
    #   DATABASE_URL: postgresql://user:password@host:5432/dbname
    #   DATABASE_URL: sqlite:////app/data/chatgpt2api.db

    # 初始管理员密码 (可选，覆盖 .env)
    #   CHATGPT2API_ADMIN_PASSWORD: change_me_please

    # 基础 URL (可选)
    #   CHATGPT2API_BASE_URL: https://your-domain.com

    # 在线更新代理 (可选，未设置时复用 CHATGPT2API_PROXY)
    #   CHATGPT2API_UPDATE_PROXY_URL: http://127.0.0.1:7890






